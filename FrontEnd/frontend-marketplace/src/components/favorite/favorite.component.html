<div class="min-h-screen bg-surface py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-8 flex items-center">
      <svg class="w-8 h-8 text-red-500 mr-3" fill="currentColor" viewBox="0 0 20 20"><path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" /></svg>
      Meus Favoritos
    </h1>

    @if (isLoading) {
      <app-loading-spinner></app-loading-spinner>
    } @else if (favoriteProducts.length === 0) {
      <div class="text-center py-20 bg-white rounded-2xl shadow-soft border border-stone-100">
        <div class="text-6xl mb-4 text-gray-300">♥</div>
        <h2 class="text-xl font-medium text-gray-900 mb-2">Sua lista de desejos está vazia.</h2>
        <p class="text-gray-500 mb-8">Salve os itens que você mais gostou para não perder de vista.</p>
        <a routerLink="/" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-full text-white bg-primary hover:bg-primary-dark transition-colors">
          Explorar Produtos
        </a>
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        @for (product of favoriteProducts; track product.id) {
          <app-product-card [product]="product"></app-product-card>
        }
      </div>
    }
  </div>
</div>
