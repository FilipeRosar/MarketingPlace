<div class="min-h-screen bg-surface flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Redefinir Senha
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-soft rounded-lg sm:px-10 border border-stone-100">

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <div>
          <label class="block text-sm font-medium text-gray-700">Nova Senha</label>
          <div class="mt-1">
            <input type="password" formControlName="newPassword"
                   class="appearance-none block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Confirmar Nova Senha</label>
          <div class="mt-1">
            <input type="password" formControlName="confirmPassword"
                   class="appearance-none block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
          </div>
        </div>

        <div *ngIf="errorMessage" class="rounded-md bg-red-50 p-4 border border-red-200 text-sm text-red-700">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="rounded-md bg-green-50 p-4 border border-green-200 text-sm text-green-700">
          {{ successMessage }}
        </div>

        <div>
          <button type="submit" [disabled]="resetForm.invalid || isLoading || !tokenFromUrl"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50">
            <span *ngIf="isLoading">Processando...</span>
            <span *ngIf="!isLoading">Alterar Senha</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
