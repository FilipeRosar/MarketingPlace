<div class="min-h-screen bg-surface flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Logo -->
    <div class="text-center cursor-pointer" routerLink="/">
      <span class="text-4xl font-bold text-primary-dark tracking-tight">
        Mitr<span class="text-primary font-light">ama</span>.
      </span>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Confirmação de Email
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-soft rounded-2xl sm:px-10 border border-stone-100">

      <!-- Loading State -->
      <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-8">
        <svg class="animate-spin h-12 w-12 text-primary mb-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-600 font-medium">Verificando seu email...</p>
      </div>

      <!-- Success State -->
      <div *ngIf="!isLoading && isSuccess" class="flex flex-col items-center py-8">
        <svg class="h-16 w-16 text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p class="text-center text-green-800 font-medium mb-4">{{ message }}</p>
        <div class="text-center text-sm text-gray-600 mb-4">
          Redirecionando para login em 3 segundos...
        </div>
        <a routerLink="/login" class="text-sm font-medium text-primary hover:text-primary-dark transition-colors">
          Clique aqui se não for redirecionado
        </a>
      </div>

      <!-- Error State -->
      <div *ngIf="!isLoading && !isSuccess" class="flex flex-col items-center py-8">
        <svg class="h-16 w-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p class="text-center text-red-800 font-medium mb-6">{{ message }}</p>
        
        <div class="w-full space-y-4">
          <button 
            (click)="resendEmail()"
            [disabled]="isLoading"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed transition-all">
            Reenviar Email de Confirmação
          </button>
          
          <a routerLink="/login" class="block w-full text-center py-3 px-4 border border-stone-300 rounded-full shadow-sm text-sm font-bold text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
            Voltar ao Login
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
