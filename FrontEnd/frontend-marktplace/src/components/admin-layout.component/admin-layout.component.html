<!-- admin-layout.component.html -->
<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 flex">

  <!-- MENU LATERAL (FIXO) -->
  <aside class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl border-r-4 border-orange-200 overflow-y-auto">
    <div class="h-full flex flex-col">

      <!-- Logo -->
      <div class="p-8 border-b-4 border-orange-200 bg-gradient-to-br from-orange-100 to-red-100">
        <div class="text-center">
          <h1 class="text-4xl font-black text-orange-900 tracking-tighter">Mitrama</h1>
          <p class="text-sm text-orange-700 font-medium mt-2">Painel do Administrador</p>
        </div>
      </div>

      <!-- Avatar + Nome -->
      <div class="p-6 border-b border-orange-100">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-white font-black text-2xl shadow-lg ring-4 ring-red-200">
           {{ (currentUser?.name ?? 'A').charAt(0).toUpperCase() }}
          </div>
          <div>
            <p class="font-black text-orange-900 text-lg">{{ currentUser?.name }}</p>
            <span class="inline-block px-3 py-1 bg-red-600 text-white text-xs font-bold rounded-full uppercase tracking-wide">ADMIN</span>
          </div>
        </div>
      </div>

      <!-- Menu Itens -->
      <nav class="flex-1 px-4 py-8 space-y-2">
        <a routerLink="/admin" routerLinkActive="active"
           class="admin-menu-item">
          Dashboard
        </a>
        <a routerLink="/admin/customers" routerLinkActive="active"
           class="admin-menu-item">
          Clientes
        </a>
        <a routerLink="/admin/sellers" routerLinkActive="active"
           class="admin-menu-item">
          Artesãos
        </a>
        <a routerLink="/admin/pending-sellers" routerLinkActive="active"
           class="admin-menu-item relative">
          Aprovação de Lojas
          @if (pendingCount() > 0) {
            <span class="absolute -top-2 -right-4 bg-red-600 text-white text-xs font-bold rounded-full w-8 h-8 flex items-center justify-center animate-pulse ring-4 ring-red-100">
              {{ pendingCount() }}
            </span>
          }
        </a>
        <a routerLink="/admin/products" routerLinkActive="active"
           class="admin-menu-item">
          Produtos
        </a>
        <a routerLink="/admin/orders" routerLinkActive="active"
           class="admin-menu-item">
          Pedidos
        </a>
        <a routerLink="/admin/commissions" routerLinkActive="active"
           class="admin-menu-item">
          Comissões
        </a>
        <a routerLink="/admin/banners" routerLinkActive="active"
           class="admin-menu-item">
          Banners
        </a>
        <a routerLink="/admin/settings" routerLinkActive="active"
           class="admin-menu-item">
          Configurações
        </a>
      </nav>

      <!-- Logout -->
      <div class="p-6 border-t-4 border-orange-200">
        <button (click)="logout()"
                class="w-full bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-black py-4 rounded-2xl shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3">
          Sair
        </button>
      </div>
    </div>
  </aside>

  <!-- ESPAÇO PRA COMPENSAR O MENU -->
  <div class="w-72"></div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 pb-20">
    <!-- Header menor (só busca e notificações) -->
    <header class="fixed top-0 right-0 left-72 z-40 bg-white/95 backdrop-blur-md border-b border-orange-200 shadow-md h-20 px-8 flex items-center justify-between">
      <div class="flex-1 max-w-2xl">
        <div class="relative">
          <input type="text" placeholder="Buscar qualquer coisa..."
                 class="w-full pl-12 pr-6 py-4 rounded-full border-2 border-orange-300 focus:border-orange-500 focus:outline-none text-lg shadow-inner">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-6 h-6 text-orange-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Notificações -->
      <div class="relative">
        <button class="relative p-4 text-orange-700 hover:text-orange-900 transition">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          @if (notifications().length > 0) {
            <span class="absolute top-2 right-2 w-4 h-4 bg-red-600 rounded-full animate-ping"></span>
            <span class="absolute top-2 right-2 w-4 h-4 bg-red-600 rounded-full"></span>
          }
        </button>
      </div>
    </header>

    <!-- Espaçador pro header fixo -->
    <div class="h-20"></div>

    <!-- Conteúdo da página (router-outlet) -->
    <div class="p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
