
<div [routerLink]="['/products', product.id]"
     class="cursor-pointer group relative bg-white rounded-2xl border border-stone-100 shadow-soft hover:shadow-hover transition-all duration-300 ease-out transform hover:-translate-y-1">

  <!-- Imagem com Badge e Botão Favorito -->
  <div class="aspect-w-1 aspect-h-1 w-full overflow-hidden rounded-t-2xl bg-gray-200 relative group-hover:opacity-100">
    <img [src]="product.imageUrl" [alt]="product.name" class="h-64 w-full object-cover object-center group-hover:scale-105 transition-transform duration-500">

    <!-- Badge Categoria -->
    <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-xs font-semibold text-gray-700 px-2.5 py-1 rounded-md shadow-sm">
      {{ product.category }}
    </span>

    <!-- Botão Favoritar (Visual) -->
    <button (click)="$event.stopPropagation()" class="absolute top-3 right-3 p-2 bg-white rounded-full shadow-sm text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
    </button>
  </div>

  <!-- Conteúdo -->
  <div class="p-5">
    <div class="flex justify-between items-start">
      <div>
        <h3 class="text-lg font-medium text-gray-900 group-hover:text-primary transition-colors line-clamp-1">
          {{ product.name }}
        </h3>
        <p class="mt-1 text-sm text-gray-500">{{ product.sellerName }}</p>
      </div>
    </div>

    <div class="mt-4 flex items-center justify-between">
      <div>
        <p class="text-xl font-bold text-gray-900">{{ product.price | currencyBr }}</p>
        <p class="text-xs text-gray-400">até 3x sem juros</p>
      </div>

      <!-- Botão de Comprar Direto -->
      <!-- (click)="addToCart($event, product)" passa o evento para parar a propagação -->
      <button
        (click)="addToCart($event, product)"
        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-stone-100 text-primary hover:bg-primary hover:text-white transition-all duration-300 focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm hover:shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
      </button>
    </div>
  </div>
</div>
