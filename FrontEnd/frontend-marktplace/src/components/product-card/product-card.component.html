<div [routerLink]="['/products', product.id]"
     class="cursor-pointer group relative bg-white rounded-2xl border border-stone-100 shadow-soft hover:shadow-hover transition-all duration-300 ease-out transform hover:-translate-y-1 h-full flex flex-col">

  <!-- Imagem -->
  <div class="aspect-square w-full overflow-hidden rounded-t-2xl bg-gray-100 relative group-hover:opacity-100">
    <img [src]="product.imageUrl" [alt]="product.name" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500">

    <!-- Badge Categoria -->
    <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-xs font-semibold text-gray-700 px-2.5 py-1 rounded-md shadow-sm">
      {{ product.category }}
    </span>

    <!-- Botão Favoritar -->
    <button (click)="toggleFavorite($event)"
            class="absolute top-3 right-3 p-2 rounded-full shadow-sm transition-all z-10"
            [ngClass]="isFavorite ? 'bg-white text-red-500 opacity-100' : 'bg-white/80 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100'">
      <svg class="w-5 h-5" [class.fill-current]="isFavorite" [class.stroke-current]="!isFavorite" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>
  </div>

  <!-- Conteúdo -->
  <div class="p-4 flex-1 flex flex-col">
    <div class="flex justify-between items-start mb-2">
      <div class="flex-1 min-w-0">
        <h3 class="text-base font-bold text-gray-900 group-hover:text-primary transition-colors truncate">
          {{ product.name }}
        </h3>
        <p class="text-xs text-gray-500 truncate">{{ product.sellerName }}</p>
      </div>
    </div>

    <div class="mt-auto flex items-center justify-between pt-2">
      <div>
        <p class="text-lg font-bold text-primary">{{ product.price | currencyBr }}</p>
        <p class="text-[10px] text-gray-400">até 3x sem juros</p>
      </div>

      <button
        (click)="addToCart($event, product)"
        class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-stone-100 text-primary hover:bg-primary hover:text-white transition-all duration-200 shadow-sm hover:shadow">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
      </button>
    </div>
  </div>
</div>
