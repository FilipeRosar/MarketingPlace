<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Marketplace Artesanato</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonte Inter (Necessária para o design) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!--
    SOLUÇÃO DE EMERGÊNCIA: Tailwind via CDN
    Isso permite que o site funcione mesmo se o build local estiver quebrado.
    NÃO use isso em produção real final, mas para desenvolvimento funciona perfeitamente.
  -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configuração do Tema (Cores e Animações) para o CDN -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#b45309',
              light: '#d97706',
              dark: '#78350f',
            },
            surface: '#fafaf9',
          },
          animation: {
            'subtle-zoom': 'subtle-zoom 20s ease-in-out infinite alternate',
            'fade-in-up': 'fade-in-up 0.8s ease-out forwards',
          },
          keyframes: {
            'subtle-zoom': {
              '0%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1.15)' },
            },
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #fafaf9; font-family: 'Inter', sans-serif; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f5f5f4; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #d97706; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
