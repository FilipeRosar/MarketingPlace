<div class="min-h-screen bg-surface flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="text-center cursor-pointer" routerLink="/">
      <span class="text-4xl font-bold text-primary-dark tracking-tight">
        Tra<span class="text-primary font-light">ma</span>.
      </span>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Redefinir Senha
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-soft rounded-2xl sm:px-10 border border-stone-100">

      <!-- Mensagem de Sucesso -->
      @if (resetSuccessful) {
        <div class="text-center p-6 space-y-4">
            <h3 class="text-xl font-bold text-green-600">Senha Redefinida!</h3>
            <p class="text-gray-600">Sua senha foi alterada com sucesso. Você já pode fazer login.</p>
            <a routerLink="/login" class="inline-flex items-center px-4 py-2 border border-transparent rounded-full text-white bg-primary hover:bg-primary-dark transition-colors">
                Ir para o Login
            </a>
        </div>
      }

      <!-- Formulário de Redefinição -->
      @if (!resetSuccessful) {
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">

          <!-- Aviso de Token Inválido -->
          @if (errorMessage && !resetForm.enabled) {
              <div class="rounded-md bg-red-50 p-4">
                  <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
              </div>
          }

          <!-- Nova Senha -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Nova Senha</label>
            <div class="mt-1">
              <input id="password" type="password" formControlName="password"
                     class="appearance-none block w-full px-3 py-3 border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
            </div>
            <div *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.errors?.['minlength']" class="text-red-500 text-xs mt-1">
                Mínimo 6 caracteres.
            </div>
          </div>

          <!-- Confirmar Senha -->
          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirmar Nova Senha</label>
            <div class="mt-1">
              <input id="confirmPassword" type="password" formControlName="confirmPassword"
                     class="appearance-none block w-full px-3 py-3 border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
            </div>
            <div *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched" class="text-red-500 text-xs mt-1">
                As senhas não coincidem.
            </div>
          </div>

          <!-- Botão -->
          <div>
            <button type="submit" [disabled]="resetForm.invalid || isLoading"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed transition-all transform hover:-translate-y-0.5">
              <span *ngIf="!isLoading">Redefinir Senha</span>
              <span *ngIf="isLoading" class="flex items-center">Processando...</span>
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
