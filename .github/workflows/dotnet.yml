name:  Build & Test - .NET API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test .NET Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ./BackEnd/MarketplaceArtesanato.sln

      - name: Build
        run: dotnet build ./BackEnd/MarketplaceArtesanato.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ./BackEnd/MarketplaceArtesanato.Tests/MarketplaceArtesanato.Tests.csproj --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish ./BackEnd/MarketplaceArtesanato.API/MarketplaceArtesanato.API.csproj -c Release -o ./publish


      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketplaceArtesanato-API
          path: ./publish
