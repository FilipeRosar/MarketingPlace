name: Deploy Frontend (Angular) to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          # Caminho ajustado para a pasta real do repositório
          cache-dependency-path: FrontEnd/frontend-marketplace/package-lock.json 
          
      - name: Install Dependencies
        # Usamos --legacy-peer-deps para ignorar conflitos de versão do ng2-charts
        run: npm install --legacy-peer-deps 
        working-directory: ./FrontEnd/frontend-marketplace/

      - name: Build Angular Application
        # Garantimos que o build é feito antes de tentar criar ficheiros na pasta dist
        run: npm run build -- --base-href=/MarketingPlace/
        working-directory: ./FrontEnd/frontend-marketplace/

      - name: Create .nojekyll file
        # Criamos a pasta se ela não existir antes do touch para evitar o erro 'No such file'
        run: |
          mkdir -p FrontEnd/frontend-marketplace/dist/frontend-marketplace/browser
          touch FrontEnd/frontend-marketplace/dist/frontend-marketplace/browser/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'FrontEnd/frontend-marketplace/dist/frontend-marketplace/browser' 
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4