name: Deploy Frontend (Angular) to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          # Caminho ajustado para a pasta real do repositório
          cache-dependency-path: FrontEnd/frontend-marketplace/package-lock.json 
          
      - name: Install Dependencies
        # Mudamos de 'npm ci' para 'npm install' com legacy-peer-deps para ignorar o conflito do ng2-charts
        run: npm install --legacy-peer-deps 
        working-directory: ./FrontEnd/frontend-marketplace/

      - name: Build Angular Application
        # Removido --output-path=docs pois o novo builder do Angular 18+ gerencia isso via angular.json
        run: npm run build -- --base-href=/MarketingPlace/
        working-directory: ./FrontEnd/frontend-marketplace/

      - name: Create .nojekyll file
        # O caminho de saída segue o nome definido no seu angular.json: "frontend-marktplace"
        run: touch FrontEnd/frontend-marketplace/dist/frontend-marktplace/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Caminho corrigido para onde o Angular realmente gera os ficheiros
          path: 'FrontEnd/frontend-marketplace/dist/frontend-marktplace/browser' 
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4