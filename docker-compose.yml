services:
  rabbitmq:
    image: rabbitmq:management
    container_name: mitrama_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]  # Comando nativo do RabbitMQ, sempre disponivel
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7-alpine
    container_name: mitrama_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redisdata:/data
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mitrama_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    image: mitrama-api
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: mitrama_backend
    ports:
      - "5253:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME:-TramaDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=${REDIS_CONNECTION:-redis:6379}
      - ConnectionStrings__RabbitMQ=${RABBITMQ_CONNECTION:-rabbitmq}
      - Storage__AzureBlob__ConnectionString=${AZURE_BLOB_CONNECTION_STRING}
      - Storage__AzureBlob__ContainerName=${AZURE_BLOB_CONTAINER:-products}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-MarketplaceArtesanatoAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-MarketplaceArtesanatoClient}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - Stripe__SuccessUrl=${STRIPE_SUCCESS_URL}
      - Stripe__CancelUrl=${STRIPE_CANCEL_URL}
      - MelhorEnvio__Token=${MELHORENVIO_TOKEN}
      - MelhorEnvio__Url=${MELHORENVIO_URL:-https://sandbox.melhorenvio.com.br}
      - Email__SmtpServer=${SMTP_SERVER:-smtp.gmail.com}
      - Email__SmtpPort=${SMTP_PORT:-587}
      - Email__Username=${SMTP_USERNAME}
      - Email__Password=${SMTP_PASSWORD}
      - Email__FromName=${SMTP_FROM_NAME:-Marketplace Artesanato}
      - Email__FromEmail=${SMTP_FROM_EMAIL}
      - Email__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - AppUrl=${APP_URL:-http://localhost:4200}
      - Turnstile__SecretKey=${TURNSTILE_SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: mitrama-web
    build:
      context: ./FrontEnd/frontend-marketplace
      dockerfile: Dockerfile
    container_name: mitrama_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlvolume:
  redisdata:
